services:
  simulator:
    build: ./backend
    command: uvicorn simulator.service:app --host 0.0.0.0 --port 8001
    volumes:
      - sim-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      SIMULATOR_URL: http://simulator:8001
    ports:
      - "8000:8000"
    depends_on:
      simulator:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sim-logs:
